<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barcode Scanner — SalonBook</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f3f0;
      color: #2d2323;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────── */
    .header {
      background: #fff;
      border-bottom: 1px solid #e8ddd7;
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .logo {
      font-size: 18px;
      font-weight: 800;
      color: #7c4d3a;
      letter-spacing: -0.4px;
      flex-shrink: 0;
    }
    .logo span { color: #c4835a; }
    .page-title {
      font-size: 14px;
      font-weight: 700;
      color: #b09080;
      white-space: nowrap;
    }
    .btn-back {
      height: 34px;
      padding: 0 14px;
      background: none;
      color: #7c4d3a;
      border: 1.5px solid #e0d4cc;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      text-decoration: none;
      margin-left: auto;
      flex-shrink: 0;
      transition: all 0.13s;
    }
    .btn-back:hover { background: #f5ede7; border-color: #c4835a; }

    /* ── WRAP ────────────────────────────────────────────── */
    .wrap {
      padding: 24px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── DROPZONE ────────────────────────────────────────── */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      border: 2px dashed #e0d4cc;
      border-radius: 14px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      color: #9e7060;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      transition: all 0.13s;
    }
    .dropzone:hover { border-color: #c4835a; background: #fdf8f5; }
    .dropzone.drag { border-color: #7c4d3a; background: #f5ede7; }
    .dropzone svg { color: #c4835a; opacity: 0.85; }
    .dz-title { font-size: 15px; font-weight: 700; color: #7c4d3a; }
    .dz-sub   { font-size: 12px; color: #b09080; }

    /* ── RESULTS ─────────────────────────────────────────── */
    .results { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }

    .result-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .thumb {
      width: 52px; height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #f0e6e0;
      flex-shrink: 0;
    }
    .thumb-ph { display: flex; align-items: center; justify-content: center; color: #c4835a; }
    .result-info { flex: 1; min-width: 0; }
    .result-name {
      font-size: 11px;
      font-weight: 600;
      color: #b09080;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    .result-code {
      font-size: 18px;
      font-weight: 800;
      color: #2d2323;
      letter-spacing: 0.5px;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .result-code.muted { font-size: 13px; font-weight: 600; color: #c4835a; }
    .result-code.fail  { font-size: 13px; font-weight: 600; color: #c04040; }

    .result-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-copy {
      background: #7c4d3a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.13s;
    }
    .btn-copy:hover { background: #6b3f2f; }
    .btn-copy.copied { background: #4a8a5c; }
    .btn-del-sm {
      background: none;
      border: 1.5px solid #f0c8c4;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      color: #c04040;
      cursor: pointer;
      transition: all 0.13s;
    }
    .btn-del-sm:hover { background: #fdf0ef; border-color: #c04040; }

    .empty {
      text-align: center;
      color: #c4a898;
      font-size: 13px;
      padding: 30px 0 0;
    }

    /* ── MOBILE ──────────────────────────────────────────── */
    @media (max-width: 640px) {
      .header { padding: 0 14px; gap: 10px; }
      .page-title { display: none; }
      .wrap { padding: 14px; }
      .dropzone { padding: 32px 16px; }
      .result-card { padding: 10px 12px; gap: 10px; }
      .thumb { width: 44px; height: 44px; }
      .result-code { font-size: 16px; }
      .btn-copy, .btn-del-sm { padding: 9px 12px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">Salon<span>Book</span></div>
  <span class="page-title">Barcode Scanner</span>
  <a class="btn-back" href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Calendar
  </a>
</header>

<div class="wrap">
  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*" multiple hidden />
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="5" width="18" height="14" rx="1.5"/>
      <path d="M7 8v8M10 8v8M13 8v8M17 8v8" stroke-width="1.4"/>
    </svg>
    <div class="dz-title">Upload barcode images</div>
    <div class="dz-sub">Click to choose, or drag &amp; drop. Multiple images supported.</div>
  </label>

  <div class="results" id="results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ================================================================
// BARCODE SCANNER
// Decodes uploaded barcode images client-side with ZXing, then
// persists each code to Supabase so it survives until deleted and
// syncs across devices in real time (same pattern as appointments).
// ================================================================
// ZXing's BrowserMultiFormatReader.decodeFromImageUrl is unreliable in this
// build, so we decode via the core API: image → canvas → luminance → bitmap.
const hints = new Map();
hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
const mfReader = new ZXing.MultiFormatReader();
mfReader.setHints(hints);

function decodeImage(img) {
  const canvas = document.createElement('canvas');
  canvas.width  = img.naturalWidth;
  canvas.height = img.naturalHeight;
  canvas.getContext('2d').drawImage(img, 0, 0);
  const lum = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
  const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
  return mfReader.decode(bmp); // throws if no barcode found
}

// Supabase — same project/key as the calendar app
const { createClient } = window.supabase;
const db = createClient(
  'https://japgfltuvdteiuydgumy.supabase.co',
  'sb_publishable_DE1bPwo_Sob4u1rYwoFsqw_qVN-g0FG'
);

function toRow(item) {
  return { id: item.id, code: item.code, filename: item.name,
           thumb: item.thumb, created_at: new Date().toISOString() };
}
function fromRow(row) {
  return { id: row.id, code: row.code, name: row.filename,
           thumb: row.thumb, status: 'ok' };
}

// Downscale to a small JPEG data URL so persisted rows stay tiny.
function makeThumb(img) {
  const max   = 120;
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth  * scale);
  const h = Math.round(img.naturalHeight * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.7);
}

let results = [];
let loading = true;

const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const resultsEl = document.getElementById('results');

fileInput.addEventListener('change', () => {
  handleFiles(fileInput.files);
  fileInput.value = ''; // allow re-uploading the same file
});

// Drag & drop
['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));

async function handleFiles(fileList) {
  for (const file of fileList) {
    if (!file.type.startsWith('image/')) continue;
    const objUrl = URL.createObjectURL(file);
    const item = {
      id:     'b' + Date.now() + Math.random().toString(36).slice(2,6),
      name:   file.name,
      thumb:  objUrl,
      code:   null,
      status: 'decoding',
    };
    results.unshift(item);
    render();

    try {
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = objUrl; });
      item.thumb = makeThumb(img);          // small data URL (replaces the object URL)
      URL.revokeObjectURL(objUrl);
      item.code   = decodeImage(img).getText();
      item.status = 'ok';
      render();
      await saveBarcode(item);              // persist successful decodes only
    } catch (err) {
      item.status = 'fail';
      render();
    }
  }
}

async function saveBarcode(item) {
  const { error } = await db.from('barcodes').upsert(toRow(item));
  if (error) alert('Couldn’t save this code (is the "barcodes" table set up?): ' + error.message);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function render() {
  if (loading) {
    resultsEl.innerHTML = `<div class="empty">Loading…</div>`;
    return;
  }
  if (!results.length) {
    resultsEl.innerHTML = `<div class="empty">No images yet — upload a barcode to read its code.</div>`;
    return;
  }
  resultsEl.innerHTML = results.map(r => {
    const codeHtml =
      r.status === 'decoding' ? `<div class="result-code muted">Decoding…</div>` :
      r.status === 'fail'     ? `<div class="result-code fail">No barcode detected</div>` :
                                `<div class="result-code">${escapeHtml(r.code)}</div>`;
    const copyBtn = r.status === 'ok'
      ? `<button class="btn-copy" id="copy-${r.id}" onclick="copyCode('${r.id}')">Copy</button>` : '';
    const thumb = r.thumb
      ? `<img class="thumb" src="${r.thumb}" alt="">`
      : `<div class="thumb thumb-ph"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8" stroke-width="1.4"/></svg></div>`;
    return `<div class="result-card">
      ${thumb}
      <div class="result-info">
        <div class="result-name">${escapeHtml(r.name)}</div>
        ${codeHtml}
      </div>
      <div class="result-actions">
        ${copyBtn}
        <button class="btn-del-sm" onclick="removeItem('${r.id}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

async function copyCode(id) {
  const item = results.find(r => r.id === id);
  if (!item || !item.code) return;
  try {
    await navigator.clipboard.writeText(item.code);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = item.code;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const btn = document.getElementById('copy-' + id);
  if (btn) {
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1400);
  }
}

async function removeItem(id) {
  const item = results.find(r => r.id === id);
  results = results.filter(r => r.id !== id);
  render();
  if (item && item.status === 'ok') {
    const { error } = await db.from('barcodes').delete().eq('id', id);
    if (error) alert('Couldn’t delete from server: ' + error.message);
  }
}

// ================================================================
// BOOT — load saved codes, then sync changes from other devices
// ================================================================
async function init() {
  const { data, error } = await db.from('barcodes')
    .select('*').order('created_at', { ascending: false });
  loading = false;
  if (!error && data) results = data.map(fromRow);
  render();

  db.channel('barcodes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'barcodes' }, ({ new: row }) => {
      if (!results.some(r => r.id === row.id)) { results.unshift(fromRow(row)); render(); }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'barcodes' }, ({ old }) => {
      results = results.filter(r => r.id !== old.id); render();
    })
    .subscribe();
}

init();
</script>
</body>
</html>
